;=============================================================================
; CyberFan - Rainmeter Skin Installer manifest
; This file defines how the .rmskin installer package is built and installed.
; It is read by the Rainmeter Skin Packager (via build.ps1 or GitHub Actions).
;=============================================================================

[rmskin]

; Load the skin automatically as soon as installation finishes
LoadType=Skin
Load=CyberFan\CyberFan.ini

; Minimum requirements - installation is rejected below these versions
MinimumRainmeter=4.5
MinimumWindows=10.0

; Package identity (the archive is named <Name>_<Version>.rmskin)
Name=CyberFan
Version=1.0.0
Author=XenozExe
