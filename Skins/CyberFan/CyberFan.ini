;=============================================================================
; CyberFan - Minimal RGB PC Case Fan + Clock
; Pure WebView2 skin: HTML/CSS/JS do all rendering, this .ini is only
; the Rainmeter container that hosts the WebView2 browser window.
;
; REQUIRED PLUGIN: WebView2 by NSTechBytes (active, works with current
; WebView2 runtimes). Install WebView2.dll into:
;   C:\Program Files\Rainmeter\Plugins\
; Download: https://github.com/NSTechBytes/WebView2/releases
; Restart Rainmeter after installing the plugin.
;=============================================================================

[Rainmeter]
; Pure WebView2 skin: the browser page runs its own clock, no skin updates.
Update=-1
ContextTitle=Open DevTools
ContextAction=[!CommandMeasure WebView2 "Open DevTools"]
ContextTitle2=Reload Page
ContextAction2=[!CommandMeasure WebView2 "Navigate Reload"]
ContextTitle3=---
ContextAction3=[]
ContextTitle4=Refresh Skin
ContextAction4=[!Refresh]
ContextTitle5=Skin Menu
ContextAction5=[!SkinMenu]
OnCloseAction=[!WriteKeyValue Variables Scale [#Scale]]

[Metadata]
Name=CyberFan
Author=Custom
Information=RGB PC Case Fan with integrated clock (WebView2)
Version=1.0.0
License=Free

[Variables]
Scale=1

;=============================================================================
; WebView2 measure - hosts index.html as the entire skin surface
;=============================================================================
[WebView2]
Measure=Plugin
Plugin=WebView2
URL=#CURRENTPATH#index.html
W=(360*#Scale#)
H=(360*#Scale#)
X=0
Y=0
Clickthrough=1
ZoomFactor=[#Scale]
DynamicVariables=1

;=============================================================================
; Invisible background that gives the skin its window size and drag area
;=============================================================================
[Background_Shape]
Meter=Shape
Shape=Rectangle 0,0,(360*#Scale#),(360*#Scale#) | StrokeWidth 0 | FillColor 0,0,0,1
MouseScrollUpAction=[!SetVariable Scale "(Clamp(#Scale#+0.1,0.5,2.5))"][!UpdateMeasure WebView2][!UpdateMeter Background_Shape][!Redraw]
MouseScrollDownAction=[!SetVariable Scale "(Clamp(#Scale#-0.1,0.5,2.5))"][!UpdateMeasure WebView2][!UpdateMeter Background_Shape][!Redraw]
RightMouseUpAction=[!SkinCustomMenu]
MouseActionCursor="None"
DynamicVariables=1

;=============================================================================
; ALTERNATIVE (old plugin, unmaintained and known to break with current
; WebView2 runtimes - only use if you already have WebView.dll):
;
; [Rainmeter]
; Update=1000
; DynamicWindowSize=1
