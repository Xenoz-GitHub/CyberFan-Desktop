name: RMSKIN Packager

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebView2 plugin DLLs
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "plugin"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Invoke-WebRequest -Uri "https://github.com/NSTechBytes/WebView2/releases/download/v1.0.0/WebView2_v1.0.0_x64_x86_dll.zip" -OutFile (Join-Path $tmp "plugin.zip")
          Expand-Archive (Join-Path $tmp "plugin.zip") -DestinationPath (Join-Path $tmp "unpacked")
          New-Item -ItemType Directory -Force -Path "Plugins\WebView2\32bit", "Plugins\WebView2\64bit" | Out-Null
          Copy-Item (Join-Path $tmp "unpacked\x32\WebView2.dll") "Plugins\WebView2\32bit\WebView2.dll"
          Copy-Item (Join-Path $tmp "unpacked\x64\WebView2.dll") "Plugins\WebView2\64bit\WebView2.dll"

      - name: Build .rmskin package
        id: builder
        uses: 2bndy5/rmskin-action@v2.0.4

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} ${{ steps.builder.outputs.arc_name }}
